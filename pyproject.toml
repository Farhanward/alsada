[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alsada"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "GEO visibility and AI-PR toolkit."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alsada = "alsada.cli:main"

[tool.setuptools]
packages = ["alsada"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
